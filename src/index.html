<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Search</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <load src="./partials/header.html" icon-path="img/sprite.svg#logo" />

  <main>
    <div class="container">
      <form class="form">
        <label>
          <input type="text" name="search-text" placeholder="Search images..." required />
        </label>
        <button type="submit">Search</button>
      </form>

      <ul class="gallery"></ul>

      <!-- Кнопка прихована, поки в галереї немає результатів -->
      <button type="button" class="load-more is-hidden">Load more</button>

      <!-- Лоадер перенесений під кнопку Load more -->
      <span class="loader is-hidden"></span>
    </div>
  </main>

  <load src="./partials/footer.html" />

  <script type="module" src="./main.js"></script>
</body>

</html>
